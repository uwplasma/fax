# First VMEC-backed stellarator reference target for FAX.
# Paths assume this repository is checked out as ../fax
# beside ../vmec_jax.

[run]
case = "LandremanPaul2021_QA_lowres"
model = "continuum"
output_dir = "outputs/landreman_paul_qa_lowres"

[equilibrium]
source = "wout"
vmec_input = "../vmec_jax/examples/data/input.LandremanPaul2021_QA_lowres"
wout = "../vmec_jax/examples/data/wout_LandremanPaul2021_QA_lowres.nc"
use_boozer = false

[grid]
radial_points = 75
m_max = 8
n_max = 8
field_periods = 2

[physics]
include_sound_coupling = false
include_fast_ions = false
fast_ion_model = "none"
density_scale = 1.0

[numerics]
precision = "float64"
jit = true
autodiff = true
eigensolver = "dense"

