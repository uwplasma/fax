[run]
case = "boozmn_global_eigenmodes"
model = "global_eigenmode"
output_dir = "outputs/boozmn_global_eigenmodes"

[equilibrium]
source = "wout"
use_boozer = true
boozmn = "../booz_xform_jax/tests/test_files/boozmn_LandremanSenguptaPlunk_section5p3.nc"

[grid]
# The current boozmn path uses the radial surfaces stored in the boozmn file.
radial_points = 5
m_max = 2
n_max = 1
field_periods = 3

[physics]
density_scale = 1.0
include_fast_ions = false
fast_ion_model = "none"

[numerics]
precision = "float64"
jit = true
autodiff = true
eigensolver = "dense"
