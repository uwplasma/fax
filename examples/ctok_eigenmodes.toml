# Global modes of the interim envelope operator on the CTOK geometry.
[geometry]
source = "boozmn"
path = "../tests/data/boozmn_ctok.nc"

[modes]
n = [2]
m_max = 6

[plasma]
density = 1e19
ion_mass = 2.0

[run]
task = "eigenmodes"
output = "../outputs/ctok_eigenmodes"
ntheta = 16
nzeta = 16
count = 6
