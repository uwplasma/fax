[run]
case = "minimal"
model = "continuum"
output_dir = "outputs"

[equilibrium]
source = "vmec_jax"
vmec_input = "../vmec_jax/input.nfp4_QH_warm_start_000_000000"
use_boozer = false

[grid]
radial_points = 64
m_max = 8
n_max = 8
field_periods = 4

[physics]
include_sound_coupling = false
include_fast_ions = false
fast_ion_model = "none"
density_scale = 1.0

[numerics]
precision = "float64"
jit = true
autodiff = true
eigensolver = "dense"

