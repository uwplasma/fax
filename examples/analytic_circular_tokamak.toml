[run]
case = "analytic_circular_tokamak"
model = "continuum"
output_dir = "outputs/analytic_circular_tokamak"

[equilibrium]
source = "analytic"
use_boozer = false

[grid]
radial_points = 96
m_max = 4
n_max = 4
field_periods = 1

[physics]
include_sound_coupling = false
include_fast_ions = false
fast_ion_model = "none"
density_scale = 1.0

[numerics]
precision = "float64"
jit = true
autodiff = true
eigensolver = "dense"
