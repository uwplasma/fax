[run]
case = "global_eigenmodes"
model = "global_eigenmode"
output_dir = "outputs/global_eigenmodes"

[equilibrium]
source = "analytic"
use_boozer = false

[grid]
radial_points = 32
m_max = 2
n_max = 1
field_periods = 1

[physics]
density_scale = 1.0
include_fast_ions = false
fast_ion_model = "none"

[numerics]
precision = "float64"
jit = true
autodiff = true
eigensolver = "dense"
