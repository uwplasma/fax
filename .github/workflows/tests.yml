name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  oldest-jax:
    name: Python 3.10, JAX 0.4.30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]" "jax==0.4.30" "jaxlib==0.4.30" "numpy<2"
      - run: python -m pytest -q

  full:
    name: Lint, vmex path and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,vmex]"
      - run: ruff check . && ruff format --check .
      - run: python -m coverage run --source=src/fax -m pytest -q -m ''
      - run: python -m coverage report --fail-under=90
      - run: sphinx-build -q -W -b html docs docs/_build/html
