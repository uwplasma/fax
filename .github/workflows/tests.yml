name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  wheel:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build, check and inspect the wheel
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/dist"
          twine check "$RUNNER_TEMP"/dist/*
          extra=$(unzip -Z1 "$RUNNER_TEMP"/dist/*.whl | grep -Ev '^(fax/[a-z_]+\.py|uwplasma_fax-[^/]+\.dist-info/.*)$' || true)
          test -z "$extra" || { echo "unexpected files in the wheel: $extra"; exit 1; }
      - name: Run an analytic case from the installed wheel, outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cp tests/install_smoke.py "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && venv/bin/python -I install_smoke.py && venv/bin/fax --help

  full:
    name: Lint, vmex path and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,vmex]"
      - run: ruff check . && ruff format --check .
      - run: pipx run cffconvert --validate
      - run: python -m coverage run --branch --source=src/fax -m pytest -q -m 'not scheduled'
      - run: python -m coverage report -m
      - run: |
          python -m coverage json -q
          python -c "import json; t = json.load(open('coverage.json'))['totals']; s, b = t['percent_statements_covered'], t['percent_branches_covered']; print(f'statements {s:.2f}%, branches {b:.2f}%'); assert min(s, b) >= 95"
      - run: sphinx-build -q -W -b html docs docs/_build/html
