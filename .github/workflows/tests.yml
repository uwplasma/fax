name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  coverage-badge:
    name: Coverage badge
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,vmex]"
      - name: Install optional Boozer coverage fixtures
        run: |
          mkdir -p "$HOME/local"
          git clone --depth 1 https://github.com/uwplasma/booz_xform_jax.git "$HOME/local/booz_xform_jax"
          python -m pip install -e "$HOME/local/booz_xform_jax"
      - name: Install public STELLGAP/AE3D validation artifacts
        run: python tools/install_public_cross_code_artifacts.py --root "$HOME/local"
      - name: Install public VMEC-equilibria catalog
        run: git clone --depth 1 https://github.com/landreman/vmec_equilibria.git "$HOME/local/vmec_equilibria"
      - name: Generate coverage badge
        run: |
          python -m coverage run --source=src/fax -m pytest
          python -m coverage json -o coverage.json
          python tools/write_coverage_badge.py coverage.json docs/_static/coverage.svg
      - name: Commit updated badge
        run: |
          if git diff --quiet -- docs/_static/coverage.svg; then
            echo "coverage badge is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_static/coverage.svg
          git commit -m "Update coverage badge [skip ci]"
          git push
