[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwplasma-fax"
version = "0.1.0"
description = "Differentiable JAX code for Alfvén eigenmodes and fast-ion physics in stellarators."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UWPlasma contributors" }]
license = "MIT"
dependencies = [
  "jax>=0.4.38",
  "solvax>=0.32.1",
  "numpy",
  "netCDF4",
  "tomli; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["alfven eigenmodes", "fast ions", "jax", "stellarator", "vmec"]

[project.urls]
Homepage = "https://github.com/uwplasma/fax"
Repository = "https://github.com/uwplasma/fax"
Documentation = "https://fax.readthedocs.io"
Issues = "https://github.com/uwplasma/fax/issues"

[project.scripts]
fax = "fax.io:main"

[project.optional-dependencies]
plot = ["matplotlib"]
vmex = ["vmex>=0.11.10; python_version >= '3.11'"]
test = ["pytest", "coverage", "matplotlib"]
docs = ["sphinx", "furo", "myst-parser"]
dev = ["uwplasma-fax[test,docs]", "ruff", "build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: end-to-end vmex runs (minutes); run with -m slow or -m ''"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/fax/__init__.py" = ["E402"]
